<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Патофизиология — Подготовка к экзамену</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#ececec;
  --text:#1a1a1a;--text2:#555;--text3:#888;
  --border:#ddd;--border2:#bbb;
  --green:#0F6E56;--green-bg:#E1F5EE;--green-mid:#5DCAA5;
  --red:#993C1D;--red-bg:#FAECE7;
  --radius:10px;--radius-sm:7px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#3a3a3a;--border2:#555;
    --green:#5DCAA5;--green-bg:#0a2e24;--green-mid:#1D9E75;
    --red:#F09595;--red-bg:#2e0d0d;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1rem}
.app{max-width:720px;margin:0 auto}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:1.5rem}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:var(--bg2);border-radius:var(--radius-sm);padding:.75rem 1rem;text-align:center;border:1px solid var(--border)}
.stat-n{font-size:24px;font-weight:600;color:var(--text)}
.stat-l{font-size:12px;color:var(--text2);margin-top:2px}
.sections{display:flex;flex-direction:column;gap:8px}
.sec-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s}
.sec-card:hover{border-color:var(--border2);background:var(--bg2)}
.sec-icon{width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sec-info{flex:1;min-width:0}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.sec-meta{font-size:12px;color:var(--text2)}
.sec-prog{margin-top:6px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.sec-prog-fill{height:100%;border-radius:2px;transition:width .4s}
.sec-arrow{color:var(--text3);font-size:18px}

/* card view */
.card-view{display:none;flex-direction:column}
.cv-top{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.cv-back{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 14px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s}
.cv-back:hover{background:var(--bg2)}
.cv-title{font-size:15px;font-weight:600;color:var(--text);flex:1}
.cv-count{font-size:13px;color:var(--text2)}
.prog-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:var(--green-mid);transition:width .3s}
.mode-toggle{display:flex;gap:6px;margin-bottom:1rem}
.mode-btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s}
.mode-btn.active{background:var(--bg2);border-color:var(--border2);color:var(--text);font-weight:600}
.flashcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);min-height:200px;padding:1.5rem;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:1rem;transition:border-color .15s;position:relative}
.flashcard:hover{border-color:var(--border2)}
.fc-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem}
.fc-q{font-size:16px;color:var(--text);line-height:1.6}
.fc-a{font-size:16px;color:var(--green);line-height:1.6;display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.fc-a.show{display:block}
.fc-hint{font-size:12px;color:var(--text3);margin-top:1rem;text-align:right}
.fc-num{font-size:11px;color:var(--text3);position:absolute;top:.9rem;right:1rem}
.card-actions{display:flex;gap:8px;margin-bottom:.75rem}
.nav-btns{display:flex;gap:8px;margin-bottom:1.5rem}
.btn{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);cursor:pointer;font-size:14px;color:var(--text);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--bg2);border-color:var(--border2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.green{background:var(--green-bg);border-color:var(--green-mid);color:var(--green)}
.btn.red-btn{background:var(--red-bg);border-color:#F09595;color:var(--red)}
.btn.marked-green{background:var(--green-bg);border-color:var(--green-mid);color:var(--green);font-weight:600}

/* list mode */
.list-mode{display:none;flex-direction:column;gap:8px}
.list-item{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.9rem 1rem}
.list-q{font-size:14px;color:var(--text);margin-bottom:6px;line-height:1.5}
.list-a{font-size:13px;color:var(--green);line-height:1.5;padding-top:6px;border-top:1px solid var(--border)}
.list-a-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-weight:600}
.no-ans{color:var(--text3);font-style:italic}

/* finished */
.fin-box{background:var(--bg2);border-radius:var(--radius);padding:2rem;text-align:center;margin-bottom:1rem;border:1px solid var(--border)}
.fin-box h2{font-size:20px;font-weight:600;margin-bottom:.5rem}
.fin-box p{font-size:14px;color:var(--text2)}
.fin-stats{display:flex;justify-content:center;gap:3rem;margin:1rem 0}
.fin-stat span{font-size:28px;font-weight:700;display:block}
.fin-stat label{font-size:12px;color:var(--text2)}

/* search */
.search-wrap{position:relative;margin-bottom:1rem}
.search-wrap input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg2);color:var(--text);font-size:14px;outline:none}
.search-wrap input:focus{border-color:var(--border2)}
.search-wrap .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}

/* shuffle btn */
.shuffle-row{display:flex;gap:8px;margin-bottom:1rem}
</style>
</head>
<body>
<div class="app">
<div id="home">
  <h1>🧬 Патофизиология</h1>
  <p class="subtitle">Подготовка к экзамену · 488 вопросов по 13 темам</p>
  <div class="stats-row">
    <div class="stat"><div class="stat-n" id="s-total">488</div><div class="stat-l">Всего вопросов</div></div>
    <div class="stat"><div class="stat-n" id="s-learned">0</div><div class="stat-l">Изучено</div></div>
    <div class="stat"><div class="stat-n" id="s-pct">0%</div><div class="stat-l">Прогресс</div></div>
  </div>
  <div class="sections" id="sec-list"></div>
</div>

<div id="cv" class="card-view">
  <div class="cv-top">
    <button class="cv-back" onclick="goHome()">← Назад</button>
    <div class="cv-title" id="cv-title"></div>
    <div class="cv-count" id="cv-count"></div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="cv-prog"></div></div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="mb-cards" onclick="setMode('cards')">🃏 Карточки</button>
    <button class="mode-btn" id="mb-list" onclick="setMode('list')">📋 Список</button>
  </div>

  <div id="cards-wrap">
    <div class="shuffle-row">
      <button class="btn" onclick="shuffleCards()" style="flex:none;padding:8px 16px;font-size:13px">🔀 Перемешать</button>
      <button class="btn" onclick="studyUnknown()" style="flex:none;padding:8px 16px;font-size:13px">🎯 Только незнакомые</button>
    </div>
    <div class="flashcard" id="fc" onclick="toggleAns()">
      <div>
        <div class="fc-label" id="fc-label">Вопрос</div>
        <div class="fc-q" id="fc-q"></div>
        <div class="fc-a" id="fc-a"></div>
      </div>
      <div class="fc-hint" id="fc-hint">Нажмите, чтобы увидеть ответ</div>
      <div class="fc-num" id="fc-num"></div>
    </div>
    <div class="card-actions">
      <button class="btn green" id="btn-know" onclick="mark(true)">✓ Знаю</button>
      <button class="btn red-btn" onclick="mark(false)">✗ Не знаю</button>
    </div>
    <div class="nav-btns">
      <button class="btn" id="btn-prev" onclick="prev()">← Пред.</button>
      <button class="btn" id="btn-next" onclick="next()">След. →</button>
    </div>
    <div id="fin" style="display:none">
      <div class="fin-box">
        <h2 id="fin-emoji">🎉 Раздел завершён!</h2>
        <div class="fin-stats">
          <div class="fin-stat"><span id="fin-k">0</span><label>Знаю</label></div>
          <div class="fin-stat"><span id="fin-n">0</span><label>Не знаю</label></div>
        </div>
        <p id="fin-msg"></p>
      </div>
      <div class="nav-btns">
        <button class="btn" onclick="restart()">🔄 Заново</button>
        <button class="btn" onclick="studyUnknown()">🎯 Незнакомые</button>
      </div>
    </div>
  </div>
  <div class="list-mode" id="list-wrap"></div>
</div>
</div>

let curSec=0,curIdx=0,showAns=false,mode='cards',fq=[];
let learned={},notLearned={};

function saveProgress(){
  try{localStorage.setItem('patfiz_learned',JSON.stringify(learned));localStorage.setItem('patfiz_not',JSON.stringify(notLearned));}catch(e){}
}
function loadProgress(){
  try{
    const l=localStorage.getItem('patfiz_learned');const n=localStorage.getItem('patfiz_not');
    if(l)learned=JSON.parse(l);if(n)notLearned=JSON.parse(n);
  }catch(e){}
}

function buildHome(){
  const el=document.getElementById('sec-list');el.innerHTML='';
  let tL=0,tQ=0;
  SECTIONS.forEach((s,i)=>{
    tQ+=s.q.length;
    const sl=s.q.filter((_,qi)=>learned[s.id+'_'+qi]).length;
    tL+=sl;
    const pct=s.q.length?Math.round(sl/s.q.length*100):0;
    const d=document.createElement('div');
    d.className='sec-card';d.onclick=()=>openSec(i);
    d.innerHTML=`<div class="sec-icon" style="background:${s.color}">${s.icon}</div>
    <div class="sec-info">
      <div class="sec-title">${s.title}</div>
      <div class="sec-meta">${s.q.length} вопр. · изучено ${sl} (${pct}%)</div>
      <div class="sec-prog"><div class="sec-prog-fill" style="width:${pct}%;background:${s.ic}"></div></div>
    </div>
    <span class="sec-arrow">›</span>`;
    el.appendChild(d);
  });
  document.getElementById('s-total').textContent=tQ;
  document.getElementById('s-learned').textContent=tL;
  document.getElementById('s-pct').textContent=Math.round(tL/tQ*100)+'%';
}

function openSec(idx,qOverride){
  curSec=idx;curIdx=0;showAns=false;
  fq=qOverride||[...SECTIONS[idx].q];
  mode='cards';
  document.getElementById('home').style.display='none';
  const cv=document.getElementById('cv');cv.style.display='flex';
  document.getElementById('cv-title').textContent=SECTIONS[idx].title;
  document.getElementById('mb-cards').className='mode-btn active';
  document.getElementById('mb-list').className='mode-btn';
  document.getElementById('cards-wrap').style.display='block';
  document.getElementById('list-wrap').style.display='none';
  renderCard();
}

function goHome(){
  document.getElementById('home').style.display='block';
  document.getElementById('cv').style.display='none';
  buildHome();
}

function renderCard(){
  const total=fq.length;
  if(curIdx>=total){showFin();return;}
  document.getElementById('fin').style.display='none';
  document.getElementById('fc').style.display='flex';
  ['card-actions','nav-btns'].forEach(id=>{
    const el=document.querySelectorAll('.'+id);
    el.forEach(e=>e.style.display='flex');
  });
  const q=fq[curIdx];
  document.getElementById('fc-q').textContent=q[0];
  document.getElementById('fc-a').textContent=q[1]||'Ответ не указан';
  document.getElementById('fc-a').className='fc-a';
  document.getElementById('fc-label').textContent='Вопрос';
  document.getElementById('fc-hint').style.display='block';
  document.getElementById('fc-num').textContent=(curIdx+1)+' / '+total;
  document.getElementById('cv-count').textContent=(curIdx+1)+'/'+total;
  const prog=Math.round(curIdx/total*100);
  document.getElementById('cv-prog').style.width=prog+'%';
  const s=SECTIONS[curSec];
  const origIdx=s.q.indexOf(q);
  const isL=origIdx>=0&&learned[s.id+'_'+origIdx];
  document.getElementById('btn-know').className='btn green'+(isL?' marked-green':'');
  document.getElementById('btn-know').textContent=isL?'✓ Знаю (отмечено)':'✓ Знаю';
  document.getElementById('btn-prev').disabled=curIdx===0;
  showAns=false;
}

function toggleAns(){
  showAns=!showAns;
  const a=document.getElementById('fc-a');
  const hint=document.getElementById('fc-hint');
  const lbl=document.getElementById('fc-label');
  if(showAns){a.className='fc-a show';lbl.textContent='Ответ';hint.style.display='none';}
  else{a.className='fc-a';lbl.textContent='Вопрос';hint.style.display='block';}
}

function mark(know){
  const s=SECTIONS[curSec];
  const q=fq[curIdx];
  const origIdx=s.q.indexOf(q);
  if(origIdx>=0){
    if(know){learned[s.id+'_'+origIdx]=true;delete notLearned[s.id+'_'+origIdx];}
    else{notLearned[s.id+'_'+origIdx]=true;delete learned[s.id+'_'+origIdx];}
    saveProgress();
  }
  if(curIdx<fq.length-1){curIdx++;renderCard();}
  else{showFin();}
}

function next(){if(curIdx<fq.length-1){curIdx++;renderCard();}}
function prev(){if(curIdx>0){curIdx--;renderCard();}}

function showFin(){
  document.getElementById('fc').style.display='none';
  document.querySelectorAll('.card-actions').forEach(e=>e.style.display='none');
  document.querySelectorAll('.nav-btns').forEach(e=>e.style.display='none');
  const s=SECTIONS[curSec];
  const lCount=fq.filter(q=>{const oi=s.q.indexOf(q);return oi>=0&&learned[s.id+'_'+oi];}).length;
  document.getElementById('fin-k').textContent=lCount;
  document.getElementById('fin-n').textContent=fq.length-lCount;
  const pct=Math.round(lCount/fq.length*100);
  document.getElementById('fin-emoji').textContent=pct===100?'🏆 Отлично!':pct>70?'🎉 Хороший результат!':'💪 Продолжайте!';
  document.getElementById('fin-msg').textContent=pct===100?'Все вопросы изучены!':pct>70?`${pct}% — повторите оставшиеся вопросы`:`${pct}% — нажмите «Незнакомые» для целевого повторения`;
  document.getElementById('cv-prog').style.width='100%';
  document.getElementById('fin').style.display='block';
  buildHome();
}

function restart(){
  fq=[...SECTIONS[curSec].q];curIdx=0;showAns=false;
  document.getElementById('fin').style.display='none';
  document.getElementById('fc').style.display='flex';
  document.querySelectorAll('.card-actions').forEach(e=>e.style.display='flex');
  document.querySelectorAll('.nav-btns').forEach(e=>e.style.display='flex');
  renderCard();
}

function studyUnknown(){
  const s=SECTIONS[curSec];
  const unk=s.q.filter((q,i)=>!learned[s.id+'_'+i]);
  if(!unk.length){alert('Все вопросы уже изучены! 🏆');return;}
  fq=unk;curIdx=0;showAns=false;
  document.getElementById('fin').style.display='none';
  document.getElementById('fc').style.display='flex';
  document.querySelectorAll('.card-actions').forEach(e=>e.style.display='flex');
  document.querySelectorAll('.nav-btns').forEach(e=>e.style.display='flex');
  renderCard();
}

function shuffleCards(){
  for(let i=fq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fq[i],fq[j]]=[fq[j],fq[i]];}
  curIdx=0;showAns=false;renderCard();
}

function setMode(m){
  mode=m;
  if(m==='cards'){
    document.getElementById('mb-cards').className='mode-btn active';
    document.getElementById('mb-list').className='mode-btn';
    document.getElementById('cards-wrap').style.display='block';
    document.getElementById('list-wrap').style.display='none';
  } else {
    document.getElementById('mb-cards').className='mode-btn';
    document.getElementById('mb-list').className='mode-btn active';
    document.getElementById('cards-wrap').style.display='none';
    const lw=document.getElementById('list-wrap');
    lw.style.display='flex';lw.innerHTML='';
    fq.forEach((q,i)=>{
      const d=document.createElement('div');d.className='list-item';
      d.innerHTML=`<div class="list-q"><span style="color:var(--text3);font-size:12px">${i+1}.</span> ${q[0]}</div>
      <div class="list-a"><div class="list-a-label">Ответ</div>${q[1]||'<span class="no-ans">Не указан в источнике</span>'}</div>`;
      lw.appendChild(d);
    });
  }
}

loadProgress();
buildHome();
</script>
